services:
  ollama:
    image: ollama/ollama:0.40.15
    container_name: rahbar-ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_KEEP_ALIVE=24h
    volumes:
      - ollama_data:/root/.ollama

  ollama-pull:
    image: ollama/ollama:0.40.15
    container_name: rahbar-ollama-pull
    restart: on-failure
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        ollama pull nomic-embed-text
        ollama pull ${LLM_MODEL:-llama3.2:1b}
    depends_on:
      - ollama

  chroma:
    image: chromadb/chroma:1.0.12
    container_name: rahbar-chroma
    ports:
      - "8001:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/data
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      - chroma_data:/data

  redis:
    image: redis:7.4-alpine
    container_name: rahbar-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]

  indexer:
    build:
      context: indexer/
      dockerfile: Dockerfile
    container_name: rahbar-indexer
    restart: on-failure
    environment:
      - EMBED_MODEL=nomic-embed-text
      - OLLAMA_URL=http://ollama:11434
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - CHROMA_COLLECTION=rahbar
      - AUTO_FETCH_CORPUS=true
      - HOME=/tmp
    volumes:
      - ./corpus/raw:/corpus:ro
    depends_on:
      chroma:
        condition: service_started
      ollama-pull:
        condition: service_completed_successfully

  api:
    build:
      context: api/
      dockerfile: Dockerfile
    container_name: rahbar-api
    ports:
      - "8000:8000"
    environment:
      - RETRIEVER=chroma
      - LLM_PROVIDER=ollama-incluster
      - OLLAMA_URL=http://ollama:11434
      - EMBED_MODEL=nomic-embed-text
      - LLM_MODEL=${LLM_MODEL:-llama3.2:1b}
      - TEMPERATURE=0.2
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - CHROMA_COLLECTION=rahbar
      - TOP_K=5
      - RELEVANCE_FLOOR=0.35
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_ENABLED=true
      - CACHE_THRESHOLD=0.95
    depends_on:
      - chroma
      - redis
      - ollama

  ui:
    build:
      context: ui/
      dockerfile: Dockerfile
    container_name: rahbar-ui
    expose:
      - "8080"
    depends_on:
      - api

  gateway:
    image: nginx:1.27-alpine
    container_name: rahbar-gateway
    ports:
      - "8080:8080"
    command:
      - /bin/sh
      - -c
      - |
        cat <<'EOF' > /etc/nginx/conf.d/default.conf
        server {
          listen 8080;
          resolver 127.0.0.11 valid=5s;
          proxy_read_timeout 180s;
          set $$api_upstream http://api:8000;
          set $$ui_upstream http://ui:8080;
          location /api/ { proxy_pass $$api_upstream; proxy_set_header Host $$host; }
          location = /readyz { proxy_pass $$api_upstream; }
          location = /healthz { proxy_pass $$api_upstream; }
          location = /metrics { proxy_pass $$api_upstream; }
          location / { proxy_pass $$ui_upstream; proxy_set_header Host $$host; }
        }
        EOF
        exec nginx -g 'daemon off;'
    depends_on:
      - api
      - ui

volumes:
  chroma_data:
  ollama_data:
