services:
  chroma:
    image: chromadb/chroma:1.0.12
    container_name: rahbar-chroma
    ports:
      - "8001:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/data
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      - chroma_data:/data

  redis:
    image: redis:7.4-alpine
    container_name: rahbar-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]

  indexer:
    build:
      context: indexer/
      dockerfile: Dockerfile
    container_name: rahbar-indexer
    restart: on-failure
    environment:
      - EMBED_MODEL=lexical-hash-768
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - CHROMA_COLLECTION=rahbar
      - AUTO_FETCH_CORPUS=true
      - HOME=/tmp
    depends_on:
      - chroma

  api:
    build:
      context: api/
      dockerfile: Dockerfile
    container_name: rahbar-api
    ports:
      - "8000:8000"
    environment:
      - RETRIEVER=chroma
      - LLM_PROVIDER=hosted
      - EMBED_MODEL=lexical-hash-768
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - CHROMA_COLLECTION=rahbar
      - TOP_K=5
      - RELEVANCE_FLOOR=0.15
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_ENABLED=true
      - CACHE_THRESHOLD=0.95
      - HOSTED_BASE_URL=https://api.groq.com/openai/v1
      - LLM_API_KEY=${LLM_API_KEY:-}
    depends_on:
      chroma:
        condition: service_started
      redis:
        condition: service_started
      indexer:
        condition: service_completed_successfully

  ui:
    build:
      context: ui/
      dockerfile: Dockerfile
    container_name: rahbar-ui
    expose:
      - "8080"
    depends_on:
      - api

  gateway:
    image: nginx:1.27-alpine
    container_name: rahbar-gateway
    ports:
      - "8080:8080"
    command:
      - /bin/sh
      - -c
      - |
        cat <<'EOF' > /etc/nginx/conf.d/default.conf
        server {
          listen 8080;
          location /api/ { proxy_pass http://api:8000/api/; proxy_set_header Host $$host; }
          location = /readyz { proxy_pass http://api:8000/readyz; }
          location = /healthz { proxy_pass http://api:8000/healthz; }
          location = /metrics { proxy_pass http://api:8000/metrics; }
          location / { proxy_pass http://ui:8080/; proxy_set_header Host $$host; }
        }
        EOF
        exec nginx -g 'daemon off;'
    depends_on:
      - api
      - ui

volumes:
  chroma_data:
