apiVersion: apps/v1
kind: Deployment
metadata:
  name: rahbar-api
  namespace: rahbar
  labels:
    app: rahbar
    component: api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: rahbar
      component: api
  template:
    metadata:
      labels:
        app: rahbar
        component: api
    spec:
      terminationGracePeriodSeconds: 30
      serviceAccountName: rahbar-api-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: aliakbar1214/rahbar-api:9031a74de8d0bca139e230515f3b861917f8ef42
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: rahbar-config
          env:
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rahbar-secret
                  key: LLM_API_KEY
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /healthz
              port: 8000
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 2
      volumes:
        - name: tmp-dir
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rahbar-api
  namespace: rahbar
  labels:
    app: rahbar
    component: api
spec:
  type: ClusterIP
  selector:
    app: rahbar
    component: api
  ports:
    - port: 8000
      targetPort: 8000
      name: http
