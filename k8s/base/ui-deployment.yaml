apiVersion: apps/v1
kind: Deployment
metadata:
  name: rahbar-ui
  namespace: rahbar
  labels:
    app: rahbar
    component: ui
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: rahbar
      component: ui
  template:
    metadata:
      labels:
        app: rahbar
        component: ui
    spec:
      terminationGracePeriodSeconds: 15
      serviceAccountName: rahbar-ui-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
      containers:
        - name: ui
          image: aliakbar1214/rahbar-ui:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: tmp-dir
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rahbar-ui
  namespace: rahbar
  labels:
    app: rahbar
    component: ui
spec:
  type: ClusterIP
  selector:
    app: rahbar
    component: ui
  ports:
    - port: 8080
      targetPort: 8080
      name: http
