apiVersion: v1
kind: ConfigMap
metadata:
  name: rahbar-config
  namespace: rahbar
data:
  RETRIEVER: "chroma"
  LLM_PROVIDER: "hosted"
  EMBED_MODEL: "lexical-hash-768"
  CHROMA_HOST: "rahbar-chroma"
  CHROMA_PORT: "8000"
  CHROMA_COLLECTION: "rahbar"
  TOP_K: "5"
  # Low temperature (0.2 in [0.0, 0.3]) keeps policy citations and JSON schema generation deterministic without suppressing syntactic fluency.
  TEMPERATURE: "0.2"
  LLM_MODEL: "llama-3.3-70b-versatile"
  OLLAMA_URL: "http://host.minikube.internal:11434"
  HOSTED_BASE_URL: "https://api.groq.com/openai/v1"
  RELEVANCE_FLOOR: "0.15"
  CACHE_ENABLED: "true"
  CACHE_THRESHOLD: "0.95"
  REDIS_HOST: "rahbar-redis"
  REDIS_PORT: "6379"
  CACHE_GENERATION_ID: "v1"
  LOG_LEVEL: "INFO"
  CORPUS_DIR: "/corpus"
  AUTO_FETCH_CORPUS: "true"
  CHUNK_SIZE: "400"
  CHUNK_OVERLAP: "50"
