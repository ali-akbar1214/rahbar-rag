apiVersion: batch/v1
kind: Job
metadata:
  name: rahbar-indexer-job
  namespace: rahbar
  labels:
    app: rahbar
    component: indexer
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: rahbar
        component: indexer
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: indexer
          image: aliakbar1214/rahbar-indexer:v1.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: rahbar-config
          env:
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rahbar-secret
                  key: LLM_API_KEY
                  optional: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1500m
              memory: 2048Mi
          securityContext:
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: corpus-volume
              mountPath: /corpus
              readOnly: true
      volumes:
        - name: corpus-volume
          configMap:
            name: rahbar-corpus-files
            optional: true
