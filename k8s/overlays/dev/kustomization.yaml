apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rahbar

resources:
  - ../../base

images:
  - name: aliakbar1214/rahbar-api
    newName: rahbar-api
    newTag: dev
  - name: aliakbar1214/rahbar-indexer
    newName: rahbar-indexer
    newTag: dev
  - name: aliakbar1214/rahbar-ui
    newName: rahbar-ui
    newTag: dev

patches:
  - target:
      kind: ConfigMap
      name: rahbar-config
    patch: |-
      - op: replace
        path: /data/LOG_LEVEL
        value: "DEBUG"
